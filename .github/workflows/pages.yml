# Página de descarga (evemtv.godebol.com) en GitHub Pages: site/ más el
# ícono de la app.
#
# Solo despliega un commit cuyas comprobaciones pasaron: se lanza cuando
# "Compilar" (build.yml) termina bien en main, y desde el mismo commit.
# release.yml la relanza a mano al publicar (para mostrar la versión); en
# ese caso, y en cualquier lanzamiento manual, primero comprueba que
# "Compilar" haya pasado en ese commit.
#
# Repositorio público: no usa secretos; solo el GITHUB_TOKEN del run.
name: Página de descarga

on:
  workflow_run:
    workflows: [Compilar]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  armar:
    name: Armar la página
    # Desde "Compilar": solo si terminó bien (y fue por un push, no por un PR).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
      actions: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      # Lanzamiento manual: "Compilar" debe haber pasado en este commit.
      - name: Comprobaciones del commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
            --commit "$SHA" --event push --status success --json databaseId -q 'length')
          if [[ "${ok:-0}" -lt 1 ]]; then
            echo "::error title=Página de descarga::\"Compilar\" no pasó en ${SHA:0:7}: no se despliega."
            exit 1
          fi

      - name: Armar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp assets/branding/icon_256.png _site/icono.png
          # Versión del último release (vacía si todavía no hay ninguno;
          # la página entonces no la muestra).
          VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VERSION=""; fi
          sed -i "s/@VERSION@/$VERSION/" _site/index.html
          echo "::notice title=Página de descarga::versión publicada: ${VERSION:-ninguna todavía}"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    name: Publicar en GitHub Pages
    needs: armar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
